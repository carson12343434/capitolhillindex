name: Daily data

on:
  schedule:
    - cron: "17 10 * * *"   # about 6 a.m. Eastern
    - cron: "17 22 * * *"   # about 6 p.m. Eastern
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data
  cancel-in-progress: false

jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt
      - run: pip install -r scripts/requirements.txt
      - name: Stock trades (House)
        run: python scripts/trades.py
        continue-on-error: true
      - name: Stock trades (Senate, when the Senate site allows it)
        run: python scripts/senate_trades.py && python scripts/trades.py
        continue-on-error: true
      - name: Polls and forecast
        run: python scripts/polls.py
        continue-on-error: true
      - name: Roll call votes
        run: python scripts/votes.py
        continue-on-error: true
      - name: Combine and build pages
        run: |
          python scripts/members.py
          python scripts/summary.py
          python scripts/build_pages.py
      - name: Save new data
        run: |
          git config user.name "data-bot"
          git config user.email "data-bot@users.noreply.github.com"
          git add -A data index.html */index.html 404.html sitemap.xml robots.txt
          git diff --cached --quiet || git commit -m "Daily data update"
          git pull --rebase --autostash && git push
