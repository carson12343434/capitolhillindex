name: Weekly data

on:
  schedule:
    - cron: "37 8 * * 1"    # Monday mornings
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data
  cancel-in-progress: false

jobs:
  money:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt
      - run: pip install -r scripts/requirements.txt
      - name: Restore FEC downloads
        uses: actions/cache@v4
        with:
          path: .cache/fec
          key: fec-${{ github.run_id }}
          restore-keys: fec-
      - name: Campaign money (FEC bulk files)
        run: python scripts/fec.py
        continue-on-error: true
      - name: Education
        run: python scripts/education.py
        continue-on-error: true
      - name: Portraits
        run: python scripts/photos.py
        continue-on-error: true
      - name: Candidate headshots
        run: python scripts/candidate_photos.py
        continue-on-error: true
      - name: Large headshots for social posts
        run: python scripts/hires_photos.py
        continue-on-error: true
      - name: Combine and build pages
        run: |
          python scripts/members.py
          python scripts/summary.py
          python scripts/build_pages.py
      - name: Save new data
        run: |
          git config user.name "data-bot"
          git config user.email "data-bot@users.noreply.github.com"
          git add -A data index.html */index.html 404.html sitemap.xml robots.txt
          git diff --cached --quiet || git commit -m "Weekly data update: campaign money, education, photos"
          git pull --rebase --autostash && git push

  gains:
    needs: money
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt
      - run: pip install -r scripts/requirements.txt
      - name: Restore stock prices
        uses: actions/cache@v4
        with:
          path: .cache/prices
          key: prices-${{ github.run_id }}
          restore-keys: prices-
      - name: Estimated trading gains
        run: python scripts/trades.py && python scripts/gains.py
        continue-on-error: true
      - name: Combine and build pages
        run: |
          python scripts/members.py
          python scripts/summary.py
          python scripts/build_pages.py
      - name: Save new data
        run: |
          git config user.name "data-bot"
          git config user.email "data-bot@users.noreply.github.com"
          git add -A data index.html */index.html 404.html sitemap.xml robots.txt
          git diff --cached --quiet || git commit -m "Weekly data update: trading gains"
          git pull --rebase --autostash && git push
