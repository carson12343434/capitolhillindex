name: Weekly data

on:
  schedule:
    - cron: "37 8 * * 1"    # Monday mornings
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data
  cancel-in-progress: false

jobs:
  weekly:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt
      - run: pip install -r scripts/requirements.txt
      - name: Restore downloaded files
        uses: actions/cache@v4
        with:
          path: .cache
          key: data-cache-${{ github.run_id }}
          restore-keys: data-cache-
      - name: Campaign money (FEC bulk files)
        run: python scripts/fec.py
        continue-on-error: true
      - name: Education
        run: python scripts/education.py
        continue-on-error: true
      - name: Estimated trading gains
        run: python scripts/trades.py && python scripts/gains.py
        continue-on-error: true
      - name: Portraits
        run: python scripts/photos.py
        continue-on-error: true
      - name: Combine and build pages
        run: |
          python scripts/members.py
          python scripts/summary.py
          python scripts/build_pages.py
      - name: Save new data
        run: |
          git config user.name "data-bot"
          git config user.email "data-bot@users.noreply.github.com"
          git add -A data index.html */index.html 404.html sitemap.xml robots.txt
          git diff --cached --quiet || git commit -m "Weekly data update"
          git pull --rebase --autostash && git push
