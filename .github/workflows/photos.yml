name: Photos

# Run by hand (Actions tab -> Photos -> Run workflow) to refresh member portraits and candidate headshots
# without waiting for the weekly job.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data
  cancel-in-progress: false

jobs:
  photos:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt
      - run: pip install -r scripts/requirements.txt
      - name: Member portraits
        run: python scripts/photos.py
      - name: Candidate headshots
        run: python scripts/candidate_photos.py
      - name: Combine and build pages
        run: |
          python scripts/members.py
          python scripts/build_pages.py
      - name: Save new data
        run: |
          git config user.name "data-bot"
          git config user.email "data-bot@users.noreply.github.com"
          git add -A data index.html */index.html 404.html sitemap.xml robots.txt
          git diff --cached --quiet || git commit -m "Photo update"
          git pull --rebase --autostash && git push
