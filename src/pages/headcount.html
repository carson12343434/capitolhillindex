<main class="wrap">
  <span class="kicker">Headcount</span>
  <h1>Can you name every member of Congress?</h1>
  <p class="lede">Type names as fast as you can. Fill in the full roster, or race the clock in a speed round and beat your high score.</p>

  <div class="tabs" role="tablist" id="modes">
    <button role="tab" aria-selected="true" data-mode="roster">Full roster</button>
    <button role="tab" aria-selected="false" data-mode="speed">Speed round</button>
  </div>
  <p class="small muted" id="modeinfo" style="margin-top:10px"></p>

  <div class="filters" id="setup" style="margin-top:6px">
    <label for="scope">Who<select id="scope"><option value="Senate">Senators</option><option value="House">Representatives</option><option value="Both">Everyone in Congress</option></select></label>
    <label for="state">State<select id="state"></select></label>
    <label for="timer">Time limit<select id="timer"></select></label>
    <label for="custom" id="customwrap" hidden>Minutes<input class="input" id="custom" type="number" min="0.5" max="60" step="0.5" value="4" style="width:90px"></label>
    <button class="btn" id="go">Start</button>
    <span class="count" id="best"></span>
  </div>

  <div id="play" hidden>
    <div class="row" style="margin:18px 0 10px;justify-content:space-between">
      <label for="guess" style="flex:1;min-width:220px"><span class="small muted">Type a name and press Enter</span>
        <input class="input" id="guess" autocomplete="off" autocapitalize="words" spellcheck="false" placeholder="e.g. Ted Cruz or Cruz" style="width:100%;font-size:18px;padding:10px 12px"></label>
      <div class="row" style="gap:18px"><div class="stat"><b id="score">0</b><span>named</span></div><div class="stat"><b id="clock">0:00</b><span id="clocklabel">elapsed</span></div>
        <button class="btn ghost" id="giveup">Give up</button></div>
    </div>
    <p class="small" id="msg" role="status" aria-live="polite" style="min-height:1.5em"></p>
    <div id="board" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px 20px"></div>
  </div>

  <section class="section" id="scores" hidden>
    <h2>Your speed round high scores</h2>
    <div class="tablewrap" style="margin-top:10px"><table class="data"><thead><tr><th>Group</th><th>Time limit</th><th class="n">High score</th><th>Set</th></tr></thead><tbody id="scorerows"></tbody></table></div>
    <p class="small muted" id="scorenote"></p>
  </section>
</main>
<script src="{{root}}data/members.js"></script>
<script src="{{root}}data/photos.js"></script>
<script src="{{root}}assets/js/headcount.js"></script>
